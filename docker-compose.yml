services:
  anvil:
    profiles: ["local"]
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16
    container_name: pumpnow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pumpnow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pumpnow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pumpnow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: pumpnow-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - pumpnow_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pumpnow
    command: npm run db:migrate:deploy
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pumpnow
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  indexer:
    build:
      context: .
      dockerfile: docker/indexer.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pumpnow
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS}
      RPC_URL: ${RPC_URL}
      CHAIN_ID: ${CHAIN_ID:-31337}
      PUMP_FACTORY_ADDRESS: ${PUMP_FACTORY_ADDRESS}
      INDEXER_START_BLOCK: ${INDEXER_START_BLOCK:-0}
      INDEXER_CONFIRMATIONS: ${INDEXER_CONFIRMATIONS:-0}
    ports: ["127.0.0.1:3002:3002"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID}
        NEXT_PUBLIC_CHAIN_NAME: ${NEXT_PUBLIC_CHAIN_NAME}
        NEXT_PUBLIC_NATIVE_SYMBOL: ${NEXT_PUBLIC_NATIVE_SYMBOL}
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL}
        NEXT_PUBLIC_BLOCK_EXPLORER_URL: ${NEXT_PUBLIC_BLOCK_EXPLORER_URL}
        NEXT_PUBLIC_PUMP_FACTORY_ADDRESS: ${NEXT_PUBLIC_PUMP_FACTORY_ADDRESS}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pumpnow_postgres_data:
  pumpnow_redis_data:
