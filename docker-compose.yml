services:
  postgres:
    image: postgres:16
    container_name: pumpnow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pumpnow
    ports:
      - "5432:5432"
    volumes:
      - pumpnow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pumpnow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: pumpnow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pumpnow_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pumpnow_postgres_data:
  pumpnow_redis_data: