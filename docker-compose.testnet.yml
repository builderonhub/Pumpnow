x-beta-logging: &beta-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    logging: *beta-logging
    environment:
      POSTGRES_DB: pumpnow_testnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pumpnow_testnet"]

  redis:
    logging: *beta-logging

  migrate:
    logging: *beta-logging
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pumpnow_testnet

  api:
    logging: *beta-logging
    env_file: .env.testnet
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pumpnow_testnet
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS}
      API_PORT: ${API_PORT:-3001}

  indexer:
    logging: *beta-logging
    env_file: .env.testnet
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pumpnow_testnet
      REDIS_URL: redis://redis:6379
      RPC_URL: ${RPC_URL}
      RPC_URLS: ${RPC_URLS:-${RPC_URL}}
      CHAIN_ID: ${CHAIN_ID}
      PUMP_FACTORY_ADDRESS: ${PUMP_FACTORY_ADDRESS}
      INDEXER_START_BLOCK: ${INDEXER_START_BLOCK}
      INDEXER_CONFIRMATIONS: ${INDEXER_CONFIRMATIONS:-0}

  web:
    logging: *beta-logging
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID}
        NEXT_PUBLIC_CHAIN_NAME: ${NEXT_PUBLIC_CHAIN_NAME}
        NEXT_PUBLIC_NATIVE_SYMBOL: ${NEXT_PUBLIC_NATIVE_SYMBOL}
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL}
        NEXT_PUBLIC_RPC_URLS: ${NEXT_PUBLIC_RPC_URLS:-${NEXT_PUBLIC_RPC_URL}}
        NEXT_PUBLIC_BLOCK_EXPLORER_URL: ${NEXT_PUBLIC_BLOCK_EXPLORER_URL}
        NEXT_PUBLIC_PUMP_FACTORY_ADDRESS: ${NEXT_PUBLIC_PUMP_FACTORY_ADDRESS}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

  nginx:
    logging: *beta-logging
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      INDEXER_DOMAIN: ${INDEXER_DOMAIN}
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.testnet.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
      indexer: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 12

  monitor:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "beta-health-monitor.mjs"]
    environment:
      WEB_HEALTH_URL: http://web:3000
      API_HEALTH_URL: http://api:3001/api/health
      INDEXER_HEALTH_URL: http://indexer:3002/health
      MONITOR_INTERVAL_MS: ${MONITOR_INTERVAL_MS:-30000}
      MONITOR_MAX_FAILURES: ${MONITOR_MAX_FAILURES:-3}
      MONITOR_MAX_INDEXER_LAG: ${MONITOR_MAX_INDEXER_LAG:-20}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - ./scripts/beta-health-monitor.mjs:/app/beta-health-monitor.mjs:ro
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
      indexer: { condition: service_healthy }
    logging: *beta-logging
